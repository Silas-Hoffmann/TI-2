<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Produtos</title>
  </head>
  <body>
    <div id="app">
      <div class="container">
        <header>
          <h1>Cadastro de Produtos</h1>
          <p>Adicione um novo produto ao sistema.</p>
        </header>

        <form id="product-form" class="form-card">
          <div class="input-group">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" name="descricao" placeholder="Ex: Notebook Dell" required>
          </div>
          
          <div class="input-row">
            <div class="input-group">
              <label for="preco">Preço (R$)</label>
              <input type="number" id="preco" name="preco" step="0.01" placeholder="0.00" required>
            </div>
            <div class="input-group">
              <label for="quantidade">Quantidade</label>
              <input type="number" id="quantidade" name="quantidade" placeholder="0" required>
            </div>
          </div>

          <div class="input-group">
            <label for="data-fabricacao">Data de Fabricação</label>
            <input type="date" id="data-fabricacao" name="data-fabricacao" required>
          </div>

          <button type="submit" class="btn-submit">Cadastrar Produto</button>
        </form>

        <div class="list-section">
          <h2>Produtos Cadastrados</h2>
          <div id="product-list" class="product-list">
            <!-- Produtos serão inseridos aqui via JS -->
            <p class="empty-state">Nenhum produto cadastrado ainda.</p>
          </div>
          
          <h3 style="margin-top: 2rem;">Estrutura JSON:</h3>
          <div id="json-view"></div>
        </div>

      </div>
    </div>

    <div id="edit-modal" class="modal">
      <div class="modal-content form-card">
        <h2>Editar Produto</h2>
        <form id="edit-form">
          <input type="hidden" id="edit-id">
          
          <div class="input-group">
            <label for="edit-descricao">Descrição</label>
            <input type="text" id="edit-descricao" required>
          </div>
          
          <div class="input-row">
            <div class="input-group">
              <label for="edit-preco">Preço (R$)</label>
              <input type="number" id="edit-preco" step="0.01" required>
            </div>
            <div class="input-group">
              <label for="edit-quantidade">Quantidade</label>
              <input type="number" id="edit-quantidade" required>
            </div>
          </div>

          <div class="input-group">
            <label for="edit-data-fabricacao">Data de Fabricação</label>
            <input type="date" id="edit-data-fabricacao" required>
          </div>

          <div class="input-row" style="margin-top: 1rem;">
            <button type="submit" class="btn-submit" style="flex: 1;">Salvar</button>
            <button type="button" class="btn-cancel" id="btn-cancel-edit" style="flex: 1;">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
